name: Daily Market Screener

on:
  schedule:
    # Runs Monday through Friday at 21:30 UTC (5:30 PM EDT / 4:30 PM EST)
    # Perfectly timed after NYSE/NASDAQ closing cross & final daily volume settlement
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# Never run two scans at once; a second trigger waits for the first.
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Screener
        run: node scripts/screener-cron.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit and Push results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/market-state.json
          git commit -m "Automated daily market scan update" || exit 0
          # Rebase onto anything pushed to main during the scan, then push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
